spring:
  application:
    name: stock-service

  datasource:
    url: jdbc:mysql://localhost:3306/stock_db
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8083

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
tradex:
  seed-demo: ${TRADEX_SEED_DEMO:false}
