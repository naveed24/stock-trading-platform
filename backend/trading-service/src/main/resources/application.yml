spring:
  application:
    name: trading-service

  datasource:
    url: jdbc:mysql://localhost:3306/trading_db
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8085

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

services:
  stock:
    url: ${STOCK_SERVICE_URL:http://localhost:8083}
  wallet:
    url: ${WALLET_SERVICE_URL:http://localhost:8084}
  portfolio:
    url: ${PORTFOLIO_SERVICE_URL:http://localhost:8086}