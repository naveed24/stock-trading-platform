spring:
  application:
    name: trading-service

  datasource:
    url: jdbc:mysql://localhost:3306/trading_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8085

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

services:
  stock:
    url: http://localhost:8083
  wallet:
    url: http://localhost:8084
  portfolio:
    url: http://localhost:8086