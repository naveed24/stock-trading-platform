spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**

            - id: stock-service
              uri: lb://stock-service
              predicates:
                - Path=/api/stocks/**

            - id: wallet-service
              uri: lb://wallet-service
              predicates:
                - Path=/api/wallet/**

            - id: trading-service
              uri: lb://trading-service
              predicates:
                - Path=/api/orders/**

            - id: portfolio-service
              uri: lb://portfolio-service
              predicates:
                - Path=/api/portfolio/**

server:
  port: 9090

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always