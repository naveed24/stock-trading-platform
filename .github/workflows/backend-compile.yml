name: Backend compile

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-compile.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-compile.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-server
          - api-gateway
          - auth-service
          - stock-service
          - wallet-service
          - trading-service
          - portfolio-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/${{ matrix.service }}/pom.xml
      - name: Compile service and tests (do not start Spring or connect to MySQL)
        run: mvn -B -ntp -DskipTests package -f backend/${{ matrix.service }}/pom.xml

  unit-tests:
    needs: compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: auth-service
            suite: AuthServiceTest
          - service: wallet-service
            suite: WalletServiceTest
          - service: trading-service
            suite: TradingServiceTest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/${{ matrix.service }}/pom.xml
      - name: Run focused database-free unit tests
        run: mvn -B -ntp -Dtest=${{ matrix.suite }} test -f backend/${{ matrix.service }}/pom.xml
